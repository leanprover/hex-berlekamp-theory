name = "hex-berlekamp-theory"
defaultTargets = ["HexBerlekampTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPolyTheory"
git = "https://github.com/leanprover/hex-poly-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexModArithTheory"
git = "https://github.com/leanprover/hex-mod-arith-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyFpTheory"
git = "https://github.com/leanprover/hex-poly-fp-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexBerlekamp"
git = "https://github.com/leanprover/hex-berlekamp.git"
rev = "v0.10.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexBerlekampTheory"

[[lean_lib]]
name = "HexBerlekampTheoryTests"
globs = ["HexBerlekampTheory.FactorPolyTests"]
